<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생용 플래시카드</title>

<style>
body { 
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    justify-content:center; 
    height:100vh; 
    margin:0; 
    background:#f0f2f5; 
    font-family:sans-serif; 
}
.card { 
    width:90%; 
    max-width:400px; 
    height:500px; 
    background:white; 
    border-radius:20px; 
    box-shadow:0 10px 20px rgba(0,0,0,0.1); 
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    justify-content:center; 
    cursor:pointer; 
    transition:transform .2s; 
    text-align:center; 
    padding:20px; 
    box-sizing:border-box; 
}
.card:active { transform:scale(.98); }
img { 
    max-width:100%; 
    max-height:70%; 
    border-radius:10px; 
    margin-bottom:20px; 
    pointer-events:none; 
}
.text { 
    font-size:2rem; 
    font-weight:bold; 
    color:#333; 
    min-height:3rem; 
}
.hint { 
    color:#888; 
    margin-top:20px; 
    font-size:.9rem; 
}
.progress { 
    margin-bottom:10px; 
    color:#555; 
}
button { 
    margin-bottom:20px; 
    font-size:1rem; 
    padding:5px 10px; 
}
</style>
</head>

<body>

<button onclick="goMenu()">メニューに戻る</button>

<div class="progress" id="progress">1 / 0</div>

<div class="card" onclick="nextCard()">
    <img id="card-img" src="">
    <div class="text" id="card-text"></div>
    <div class="hint">(画面をクリックすると次のカードに進みます。)</div>
</div>

<script>

const flashcards = [
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d01.png", text:"빵을 사요", audio:"dy01.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d02.png", text:"사과를 먹어요", audio:"dy02.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d03.png", text:"조깅해요", audio:"dy03.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d04.png", text:"영화를 봐요", audio:"dy04.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d05.png", text:"우동을 먹어요", audio:"dy05.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d06.png", text:"도쿄에 살아요", audio:"dy06.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d07.png", text:"안경을 찾아요", audio:"dy07.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d08.png", text:"술을 마셔요", audio:"dy08.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d09.png", text:"침대에서 자요", audio:"dy09.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d10.png", text:"회사에서 일해요", audio:"dy10.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d11.png", text:"책을 읽어요", audio:"dy11.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d12.png", text:"집에서 공부해요", audio:"dy12.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d13.png", text:"야구를 봐요", audio:"dy13.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d14.png", text:"학교에 가요", audio:"dy14.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d15.png", text:"소파에 앉아요", audio:"dy15.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d16.png", text:"친구를 만나요", audio:"dy16.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d17.png", text:"일본에 와요", audio:"dy17.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d18.png", text:"전철을 타요", audio:"dy18.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d19.png", text:"갈비는 맛있어요", audio:"dy19.mp3" },
    { img:"https://raw.githubusercontent.com/wakuseiboy-prog/korean/main/d20.png", text:"노래방에서 노래해요", audio:"dy20.mp3" }
];

let shuffled = [];
let currentIndex = 0;
let step = 0; // 0=이미지, 1=문자, 2=음성

// Audio 객체
const player = new Audio();
player.preload = "auto";

// 카드 순서를 랜덤으로 섞기
function shuffleCards() {
    shuffled = [...flashcards];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    currentIndex = 0;
}

// 이미지 표시
function showQuestion() {
    const card = shuffled[currentIndex];

    document.getElementById("card-img").src = card.img;
    document.getElementById("card-text").innerText = "";
    document.getElementById("progress").innerText =
        `${currentIndex + 1} / ${shuffled.length}`;

    step = 0;

    if (card.audio) {
        player.src = card.audio;
    }
}

// 문자 표시
function showText() {
    const card = shuffled[currentIndex];
    document.getElementById("card-text").innerText = card.text;
}

// 음성 재생
function playAudio() {
    const card = shuffled[currentIndex];

    if (!card.audio) return;

    player.currentTime = 0;
    player.play();
}

// 클릭 시 단계 진행
function nextCard() {

    if (step === 0) {

        showText();
        step = 1;

    } else if (step === 1) {

        playAudio();
        step = 2;

    } else {

        currentIndex++;

        // 마지막 카드까지 보면 다시 랜덤으로 섞음
        if (currentIndex >= shuffled.length) {
            shuffleCards();
        }

        showQuestion();
    }
}

function goMenu() {
    window.location.href = "index.html";
}

window.onload = () => {
    shuffleCards();
    showQuestion();
};

</script>

</body>
</html>
