<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국어 암기카드</title>

<style>
body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    background:#f0f2f5;
    font-family:sans-serif;
}

.card {
    width:90%;
    max-width:400px;
    height:500px;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    text-align:center;
    padding:20px;
}

img {
    max-width:100%;
    max-height:65%;
    border-radius:10px;
    margin-bottom:15px;
    object-fit: contain;
}

.text {
    font-size:2.3rem;
    font-weight:bold;
    color:#333;
    min-height:3rem;
}

.progress { margin-bottom:10px; color:#555; }

.hint {
    color:#888;
    margin-top:20px;
    font-size:.9rem;
}
</style>
</head>

<body>

<button onclick="goMenu()" style="margin-bottom:20px;font-size:1rem;padding:5px 10px; cursor:pointer;">
메뉴に戻る
</button>

<div class="progress" id="progress"></div>

<div class="card" onclick="nextStep()">
    <img id="card-img" alt="카드 이미지">

let index = 0;
let step = 0;
let audioObj = new Audio();

function render() {
    const c = flashcards[index];
    const img = document.getElementById("card-img");
    const text = document.getElementById("card-text");

    img.src = c.img;

    if (step === 0) {
        text.innerText = "";
    } else if (step === 1) {
        text.innerText = c.text;
    } else if (step === 2) {
        audioObj.pause();
        audioObj = new Audio(c.audio);
        audioObj.play().catch(()=>{});
    }

    document.getElementById("progress").innerText =
        `${index + 1} / ${flashcards.length}`;
}

function nextStep() {
    step++;

    if (step > 2) {
        index++;
        if (index >= flashcards.length) index = 0;
        step = 0;
    }

    render();
}

function goMenu() {
    window.location.href = "../index.html";
}

window.onload = function() {
    render();
};
</script>

</body>
</html>
